name: Compilar Flet APK

on:
  push:
    branches: [ main, master ] # Se ejecuta al hacer push a main o master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Configurar Java (Requerido para compilar Android)
      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Configurar Flutter SDK
      - name: Configurar Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # 5. Instalar dependencias de Python y Flet
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install flet flet-cli
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 6. Compilar el APK con Flet
      - name: Compilar APK
        run: flet build apk

      # 7. Subir el APK como artefacto descargable
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/apk/*.apk
